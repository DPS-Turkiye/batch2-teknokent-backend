server:
  port: ${SERVER_PORT:8080}

spring:
  main:
    banner-mode: "off"
  log-startup-info: false
  application:
    name: backend

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:db}
    username: ${DATABASE_USERNAME:teknokent}
    password: ${DATABASE_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}

  jpa:
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: ${JPA_SHOW_SQL:false}

  security:
    user:
      name: ${SECURITY_USERNAME}
      password: ${SECURITY_PASSWORD}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}

logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate: WARN
    org.hibernate.type: WARN
    org.hibernate.engine: WARN
    org.hibernate.boot: WARN
    org.hibernate.validator: WARN
    org.hibernate.SQL: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
    com.zaxxer.hikari: WARN
    org.springdoc: ERROR
    org.springframework.boot: WARN
    com.dps.teknokent: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/docs

profile-labs:
  parser-url: ${PROFILE_PARSER_URL:http://host.docker.internal:8765}
  matcher-url: ${PROFILE_MATCHER_URL:http://host.docker.internal:8766}

matching:
  pgvector:
    enabled: ${MATCHING_PGVECTOR_ENABLED:true}

meeting:
  provider:
    # The meeting assistant is optional for local MVP work. Supplying no
    # provider configuration must not prevent the rest of the API from starting.
    base-url: ${MEETING_PROVIDER_BASE_URL:http://localhost}
    api-key: ${MEETING_PROVIDER_API_KEY:}
