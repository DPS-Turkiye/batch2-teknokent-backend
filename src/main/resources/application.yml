server:
  port: ${SERVER_PORT:8080}

spring:
  main:
    banner-mode: "off"
  log-startup-info: false
  application:
    name: backend

  # Errors and match reasons follow the caller's Accept-Language; without one they are Turkish.
  web:
    locale: tr

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:db}
    username: ${DATABASE_USERNAME:teknokent}
    password: ${DATABASE_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  security:
    user:
      name: ${SECURITY_USERNAME}
      password: ${SECURITY_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate: WARN
    org.hibernate.type: WARN
    org.hibernate.engine: WARN
    org.hibernate.boot: WARN
    org.hibernate.validator: WARN
    org.hibernate.SQL: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
    com.zaxxer.hikari: WARN
    org.springdoc: ERROR
    org.springframework.boot: WARN
    com.dps.teknokent: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# The API map is public when on, so it stays off unless a local .env asks for it.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api/v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api/docs

ai:
  provider: ${AI_PROVIDER:openai}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    profile-model: ${OPENAI_MODEL:gpt-4o-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    profile-model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
    report-model: ${OPENROUTER_REPORT_MODEL:${OPENROUTER_MODEL:openai/gpt-4o-mini}}
    embedding-model: ${OPENROUTER_EMBEDDING_MODEL:openai/text-embedding-3-small}
    app-name: ${OPENROUTER_APP_NAME:TeamTNT Spring Backend}

app:
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
    credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
  notifications:
    reminders:
      enabled: ${NOTIFICATION_REMINDERS_ENABLED:true}
      interval-ms: ${NOTIFICATION_REMINDERS_INTERVAL_MS:60000}
  s3:
    region: ${AWS_REGION:}
    bucket: ${AWS_S3_BUCKET:}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  mail:
    region: ${AWS_REGION:eu-central-1}
    from: ${MAIL_FROM:}
    public-url: ${APP_PUBLIC_URL:https://menton.com.tr}
  realtime:
    token-secret: ${REALTIME_TOKEN_SECRET:}
    token-ttl-seconds: ${REALTIME_TOKEN_TTL_SECONDS:60}
    allowed-origins: ${REALTIME_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://menton.com.tr,https://www.menton.com.tr}
    document-ttl-hours: ${REALTIME_DOCUMENT_TTL_HOURS:12}
    seed-lock-seconds: ${REALTIME_SEED_LOCK_SECONDS:30}
  documents:
    # Same trusted frontend origins as app.realtime.allowed-origins by default.
    # Exact origins only: a pattern such as https://*.amplifyapp.com trusts every Amplify app on the internet.
    allowed-origins: ${DOCUMENTS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://menton.com.tr,https://www.menton.com.tr}

profile-parsing:
  ocr:
    executable: ${TESSERACT_EXECUTABLE:tesseract}
    languages: ${TESSERACT_LANGUAGES:tur+eng}
    timeout-seconds: ${TESSERACT_TIMEOUT_SECONDS:45}

matching:
  pgvector:
    enabled: ${MATCHING_PGVECTOR_ENABLED:true}

meeting:
  provider:
    # The meeting assistant is optional for local MVP work. Supplying no
    # provider configuration must not prevent the rest of the API from starting.
    base-url: ${MEETING_PROVIDER_BASE_URL:http://localhost}
    api-key: ${MEETING_PROVIDER_API_KEY:}
  transcript-bot:
    enabled: ${MEETING_TRANSCRIPT_BOT_ENABLED:true}
    interval-ms: ${MEETING_TRANSCRIPT_BOT_INTERVAL_MS:30000}
    max-concurrent: ${MEETING_TRANSCRIPT_BOT_MAX_CONCURRENT:2}
