server:
  port: ${SERVER_PORT:8080}

spring:
  main:
    banner-mode: "off"
  log-startup-info: false
  application:
    name: backend

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:db}
    username: ${DATABASE_USERNAME:teknokent}
    password: ${DATABASE_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}

  jpa:
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: ${JPA_SHOW_SQL:false}

  security:
    user:
      name: ${SECURITY_USERNAME}
      password: ${SECURITY_PASSWORD}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}

logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate: WARN
    org.hibernate.type: WARN
    org.hibernate.engine: WARN
    org.hibernate.boot: WARN
    org.hibernate.validator: WARN
    org.hibernate.SQL: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
    com.zaxxer.hikari: WARN
    org.springdoc: ERROR
    org.springframework.boot: WARN
    com.dps.teknokent: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/docs

ai:
  provider: ${AI_PROVIDER:openai}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    profile-model: ${OPENAI_MODEL:gpt-4o-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    profile-model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
    report-model: ${OPENROUTER_REPORT_MODEL:${OPENROUTER_MODEL:openai/gpt-4o-mini}}
    embedding-model: ${OPENROUTER_EMBEDDING_MODEL:openai/text-embedding-3-small}
    app-name: ${OPENROUTER_APP_NAME:TeamTNT Spring Backend}

app:
  realtime:
    token-secret: ${REALTIME_TOKEN_SECRET:}
    token-ttl-seconds: ${REALTIME_TOKEN_TTL_SECONDS:60}
    allowed-origins: ${REALTIME_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://main.dxcmjf7esever.amplifyapp.com}

profile-parsing:
  ocr:
    executable: ${TESSERACT_EXECUTABLE:tesseract}
    languages: ${TESSERACT_LANGUAGES:tur+eng}
    timeout-seconds: ${TESSERACT_TIMEOUT_SECONDS:45}

matching:
  pgvector:
    enabled: ${MATCHING_PGVECTOR_ENABLED:true}

meeting:
  provider:
    # The meeting assistant is optional for local MVP work. Supplying no
    # provider configuration must not prevent the rest of the API from starting.
    base-url: ${MEETING_PROVIDER_BASE_URL:http://localhost}
    api-key: ${MEETING_PROVIDER_API_KEY:}
