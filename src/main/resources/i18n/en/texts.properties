# English. Same keys as tr/texts.properties. MessageFormat patterns: write an apostrophe as ''.

mail.coordinatorAccount.subject=Your menton coordinator account is ready
mail.coordinatorAccount.body=Hello {0},\n\nA coordinator account has been created for you on menton (METU Technopolis). Open this link to set your password:\n\n{1}\n\nOnce your password is set, you can sign in at {2}. If the link expires, use "Forgot password?" on the sign-in page to get a new one, or ask your administrator to send the e-mail again.\n\nmenton
mail.coordinatorAssigned.subject=You are now a coordinator on menton
mail.coordinatorAssigned.body=Hello {0},\n\nYou can now manage programs as a coordinator on menton (METU Technopolis). Sign in with your current password: {1}\n\nmenton
mail.mentorPoolInvite.subject=menton: invitation to the {0} mentor pool
mail.mentorPoolInvite.body=Hello,\n\nYou have been invited to the mentor pool of the {0} program.\n\nYour sign-up link (valid for 7 days): {1}\n\nSign up with this e-mail address; you will join the pool once the coordinator approves you.\n\nmenton
mail.passwordReset.subject=Reset your menton password
mail.passwordReset.body=Hello,\n\nA password reset was requested for your menton (METU Technopolis) account. Open this link to set a new password:\n\n{0}\n\nIf you did not ask for this, you can ignore this e-mail; your password stays the same.\n\nmenton
mail.verifyEmail.subject=Verify your menton e-mail address
mail.verifyEmail.body=Hello,\n\nWelcome to menton (METU Technopolis). Verify your e-mail address with this link to finish signing up:\n\n{0}\n\nIf you did not sign up, you can ignore this e-mail.\n\nmenton
mail.newRequest.body=Hello {0},\n\n{1}\n\nTo see the request: {2}\n\nMenton
mail.teamCode.subject=menton: your {0} team code
mail.teamCode.body=Hello,\n\nYou have been invited to the {0} program as the lead of the {1} team.\n\nYour team code: {2}\n\nSign up with this code at {3}. Once you have signed up, you can share the same code with your teammates.\n\nmenton

