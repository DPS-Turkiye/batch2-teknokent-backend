mail.coordinatorAccount.subject=menton koordinatör hesabınız hazır
mail.coordinatorAccount.body=Merhaba {0},\n\nmenton''da (ODTÜ Teknokent) sizin için bir koordinatör hesabı açıldı. Şifrenizi belirlemek için bu bağlantıyı açın:\n\n{1}\n\nŞifrenizi belirledikten sonra {2} adresinden giriş yapabilirsiniz. Bağlantının süresi dolarsa giriş sayfasındaki "Şifremi unuttum" ile yenisini isteyebilir ya da yöneticinizden e-postayı tekrar göndermesini isteyebilirsiniz.\n\nmenton
mail.coordinatorAssigned.subject=menton''da koordinatör olarak atandınız
mail.coordinatorAssigned.body=Merhaba {0},\n\nmenton''da (ODTÜ Teknokent) artık programları koordinatör olarak yönetebilirsiniz. Mevcut şifrenizle giriş yapabilirsiniz: {1}\n\nmenton
mail.mentorPoolInvite.subject=menton: {0} mentor havuzuna davet
mail.mentorPoolInvite.body=Merhaba,\n\n{0} programının mentor havuzuna davet edildiniz.\n\nKayıt bağlantınız (7 gün geçerli): {1}\n\nBu e-posta adresiyle kayıt olun; koordinatör onayladığında havuza eklenirsiniz.\n\nmenton
mail.newRequest.body=Merhaba {0},\n\n{1}\n\nTalebi görmek için: {2}\n\nMenton
mail.teamCode.subject=menton: {0} takım kodunuz
mail.teamCode.body=Merhaba,\n\n{0} programına {1} takımının yetkilisi olarak davet edildiniz.\n\nTakım kodunuz: {2}\n\n{3} adresinden bu kodla kayıt olun. Kayıt olduktan sonra aynı kodu ekip arkadaşlarınızla paylaşabilirsiniz.\n\nmenton

