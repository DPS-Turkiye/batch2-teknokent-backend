# Local Moodle 4.5 for developing office hours (LTI 1.3). Not used in production.
#   docker compose -f dev/moodle/compose.yml up -d     → http://localhost:8081 (first start takes a few minutes)
# Admin sign-in: the MOODLE_USERNAME / MOODLE_PASSWORD below. See README.md for registering the tool.
name: teknokent-moodle

services:
  moodle:
    image: bitnamilegacy/moodle:4.5
    ports:
      - "8081:8080"
    environment:
      MOODLE_DATABASE_TYPE: mariadb
      MOODLE_DATABASE_HOST: mariadb
      MOODLE_DATABASE_PORT_NUMBER: 3306
      MOODLE_DATABASE_USER: moodle
      MOODLE_DATABASE_PASSWORD: moodle-local
      MOODLE_DATABASE_NAME: moodle
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: Admin-local-1
      MOODLE_EMAIL: admin@example.com
      MOODLE_SITE_NAME: ODTÜClass (local)
      # The tool lives on plain http://localhost locally; Moodle would refuse to call it otherwise.
      MOODLE_SSLPROXY: "no"
      ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata_data:/bitnami/moodledata
    depends_on:
      - mariadb

  mariadb:
    image: bitnamilegacy/mariadb:11.4
    environment:
      MARIADB_USER: moodle
      MARIADB_PASSWORD: moodle-local
      MARIADB_DATABASE: moodle
      MARIADB_ROOT_PASSWORD: root-local
      MARIADB_CHARACTER_SET: utf8mb4
      MARIADB_COLLATE: utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/bitnami/mariadb

volumes:
  moodle_data:
  moodledata_data:
  mariadb_data:
