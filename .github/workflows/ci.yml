name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.16.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Run tests
        run: ./mvnw -B clean test

  smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.16.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Prepare environment
        run: cp .env.example .env

      - name: Start stack
        run: docker compose up --build -d

      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:8080/health; then
              echo
              exit 0
            fi
            echo "Waiting for app... (${attempt}/30)"
            sleep 3
          done
          echo "Health check failed"
          docker compose logs
          exit 1

      - name: Smoke test health response
        run: |
          response="$(curl -sf http://localhost:8080/health)"
          echo "$response"
          echo "$response" | grep -q '"status":"UP"'
          echo "$response" | grep -q '"database":"UP"'

      - name: Stop stack
        if: always()
        run: docker compose down -v
