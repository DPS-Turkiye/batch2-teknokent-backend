name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.16.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: .ci/m2
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        run: ./mvnw -B clean test
        env:
          MVNW_M2_HOST_DIR: .ci/m2

  smoke-test:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.16.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Prepare environment
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: teknokent-app:local
          cache-from: type=gha,scope=teknokent-app
          cache-to: type=gha,mode=max,scope=teknokent-app

      - name: Smoke test stack
        run: |
          docker compose up -d

          echo "Waiting for /health..."
          for attempt in $(seq 1 90); do
            if response="$(curl -sf http://localhost:8080/health 2>/dev/null)"; then
              echo "$response"
              echo "$response" | grep -q '"status":"UP"'
              echo "$response" | grep -q '"database":"UP"'
              exit 0
            fi
            sleep 1
          done

          echo "Health check failed after 90s"
          docker compose logs
          exit 1

      - name: Stop stack
        if: always()
        run: docker compose down -v
