name: Deploy

# A v* tag builds, verifies and ships that release. Running the workflow by hand with an existing tag
# redeploys an image that is already in ECR (a rollback); nothing is rebuilt.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release already in ECR to deploy, e.g. v1.6.94"
        required: true
        type: string

permissions:
  id-token: write
  contents: write

# One deploy at a time, in the order they were started; a second tag waits instead of racing the first.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: teknokent-backend
  EC2_NAME_TAG: teknokent-app
  RDS_INSTANCE_ID: teknokent-postgres
  HEALTH_URL: https://d2ulpskrb4nc9m.cloudfront.net/api/health
  HEALTH_TIMEOUT_SECONDS: "240"
  PRE_DEPLOY_SNAPSHOTS_KEPT: "5"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Resolve release
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
            BUILD=false
          else
            TAG="${REF_NAME}"
            BUILD=true
          fi
          # The tag ends up in shell commands on the instance and in the snapshot name.
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like v1.2.3, got '${TAG}'."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"

      # The commit that triggered the run: the tag's commit for a tag push, the chosen branch for a manual
      # redeploy. A redeploy builds nothing, and older tags predate .github/scripts, so the tag itself is
      # not checked out then.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history and tags, to see whether the release adds database migrations.
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Maven dependencies
        if: steps.release.outputs.build == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ci/m2
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # The same gate as CI: zero-warning build, tests, format, lint and the coverage floor.
      - name: Verify
        if: steps.release.outputs.build == 'true'
        run: ./mvnw -B clean verify
        env:
          MVNW_M2_HOST_DIR: .ci/m2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2

      - name: Build and push image
        if: steps.release.outputs.build == 'true'
        env:
          IMAGE_TAG: ${{ steps.release.outputs.tag }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          # --provenance=false: push a single manifest, not an index plus an untagged attestation.
          docker build --provenance=false --build-arg APP_VERSION="${IMAGE_TAG}" -t "${IMAGE_URI}" -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" .
          docker push "${IMAGE_URI}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Check the image is in ECR
        if: steps.release.outputs.build != 'true'
        env:
          IMAGE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids imageTag="${IMAGE_TAG}" >/dev/null; then
            echo "${IMAGE_TAG} is not in ECR (only the newest releases are kept). Push the tag again to rebuild it."
            exit 1
          fi

      - name: Find the app instance
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${EC2_NAME_TAG}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ "${INSTANCE_ID}" = "None" ] || [ -z "${INSTANCE_ID}" ]; then
            echo "No running EC2 instance with tag Name=${EC2_NAME_TAG}"
            exit 1
          fi

          echo "Waiting for EC2 bootstrap (/opt/batch2/deploy.sh + docker)..."
          for attempt in $(seq 1 36); do
            if .github/scripts/ssm-run.sh "${INSTANCE_ID}" 30 \
              "test -x /opt/batch2/deploy.sh && systemctl is-active --quiet docker" >/dev/null 2>&1; then
              echo "EC2 bootstrap ready."
              break
            fi
            if [ "${attempt}" -eq 36 ]; then
              echo "Timed out waiting for EC2 bootstrap."
              exit 1
            fi
            echo "Bootstrap not ready yet (${attempt}/36), retrying in 10s..."
            sleep 10
          done

          echo "id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"

      # Remember what is running now, so a failed release can be put back.
      - name: Record the running release
        id: current
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          IMAGE=$(.github/scripts/ssm-run.sh "${INSTANCE_ID}" 30 \
            "docker inspect --format '{{.Config.Image}}' batch2-app 2>/dev/null || true" | tr -d '[:space:]')
          echo "Running now: ${IMAGE:-nothing}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${IMAGE##*:}" >> "$GITHUB_OUTPUT"

      # Flyway migrates on startup, so a release with new migrations changes the database before anyone
      # can check it. Snapshot first; releases without migrations skip this.
      - name: Snapshot the database if the release migrates it
        env:
          TAG: ${{ steps.release.outputs.tag }}
          CURRENT_TAG: ${{ steps.current.outputs.tag }}
        run: |
          MIGRATIONS=src/main/resources/db/migration
          if [ -n "${CURRENT_TAG}" ] && git rev-parse -q --verify "refs/tags/${CURRENT_TAG}" >/dev/null; then
            CHANGED=$(git diff --name-only "${CURRENT_TAG}" "${TAG}" -- "${MIGRATIONS}")
          else
            CHANGED="unknown: running release '${CURRENT_TAG}' is not a git tag"
          fi

          if [ -z "${CHANGED}" ]; then
            echo "No migration changes between ${CURRENT_TAG} and ${TAG}; no snapshot."
            exit 0
          fi
          echo "Migration changes:"
          echo "${CHANGED}"

          SNAPSHOT_ID="pre-${TAG//./-}-$(date -u +%Y%m%d-%H%M%S)"
          aws rds create-db-snapshot \
            --db-instance-identifier "${RDS_INSTANCE_ID}" \
            --db-snapshot-identifier "${SNAPSHOT_ID}" >/dev/null
          echo "Waiting for ${SNAPSHOT_ID}..."
          aws rds wait db-snapshot-available --db-snapshot-identifier "${SNAPSHOT_ID}"
          echo "Snapshot ${SNAPSHOT_ID} is available."

          # Keep the newest few pre-deploy snapshots; the daily automated backups are separate.
          aws rds describe-db-snapshots \
            --db-instance-identifier "${RDS_INSTANCE_ID}" \
            --snapshot-type manual \
            --query "sort_by(DBSnapshots[?starts_with(DBSnapshotIdentifier, 'pre-')], &SnapshotCreateTime)[].DBSnapshotIdentifier" \
            --output text | tr '\t' '\n' | head -n "-${PRE_DEPLOY_SNAPSHOTS_KEPT}" |
            while read -r OLD; do
              [ -n "${OLD}" ] || continue
              echo "Deleting old snapshot ${OLD}"
              aws rds delete-db-snapshot --db-snapshot-identifier "${OLD}" >/dev/null
            done

      - name: Deploy to EC2 (SSM)
        id: deploy
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.release.outputs.tag }}
        run: .github/scripts/ssm-run.sh "${INSTANCE_ID}" 600 "/opt/batch2/deploy.sh ${IMAGE_URI}"

      - name: Wait until the release is healthy
        id: health
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: .github/scripts/wait-healthy.sh "${HEALTH_URL}" "${TAG}" "${HEALTH_TIMEOUT_SECONDS}"

      - name: Roll back to the previous release
        if: >-
          failure()
          && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure')
          && steps.current.outputs.image != ''
          && steps.current.outputs.tag != steps.release.outputs.tag
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          TAG: ${{ steps.release.outputs.tag }}
          PREVIOUS_IMAGE: ${{ steps.current.outputs.image }}
          PREVIOUS_TAG: ${{ steps.current.outputs.tag }}
        run: |
          echo "::group::Last log lines of the failed release"
          .github/scripts/ssm-run.sh "${INSTANCE_ID}" 30 "docker logs --tail 150 batch2-app 2>&1" || true
          echo "::endgroup::"

          echo "${TAG} failed; putting ${PREVIOUS_TAG} back."
          .github/scripts/ssm-run.sh "${INSTANCE_ID}" 600 "/opt/batch2/deploy.sh ${PREVIOUS_IMAGE}"
          .github/scripts/wait-healthy.sh "${HEALTH_URL}" "${PREVIOUS_TAG}" "${HEALTH_TIMEOUT_SECONDS}"

          {
            echo "### ${TAG} rolled back"
            echo "${TAG} did not become healthy, so ${PREVIOUS_TAG} is running again."
            echo "Any database migrations ${TAG} applied are still in place; the pre-deploy snapshot has the earlier state."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: GitHub Release
        if: steps.release.outputs.build == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          append_body: true
          body: |
            ### Deploy

            **ECR image:** `${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.release.outputs.tag }}`
