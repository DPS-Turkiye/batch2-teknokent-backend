name: Deploy

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: teknokent-backend
  EC2_NAME_TAG: teknokent-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: .ci/m2
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        run: ./mvnw -B clean test
        env:
          MVNW_M2_HOST_DIR: .ci/m2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.ref_name }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build --build-arg APP_VERSION="${IMAGE_TAG}" -t "${IMAGE_URI}" -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" .
          docker push "${IMAGE_URI}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Deploy to EC2 (SSM)
        env:
          IMAGE_TAG: ${{ github.ref_name }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${EC2_NAME_TAG}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ "${INSTANCE_ID}" = "None" ] || [ -z "${INSTANCE_ID}" ]; then
            echo "No running EC2 instance with tag Name=${EC2_NAME_TAG}"
            exit 1
          fi

          echo "Waiting for EC2 bootstrap (/opt/batch2/deploy.sh + docker)..."
          for attempt in $(seq 1 36); do
            WAIT_ID=$(aws ssm send-command \
              --document-name "AWS-RunShellScript" \
              --instance-ids "${INSTANCE_ID}" \
              --parameters 'commands=["test -x /opt/batch2/deploy.sh && systemctl is-active --quiet docker"]' \
              --query 'Command.CommandId' \
              --output text)

            aws ssm wait command-executed \
              --command-id "${WAIT_ID}" \
              --instance-id "${INSTANCE_ID}" || true

            WAIT_STATUS=$(aws ssm get-command-invocation \
              --command-id "${WAIT_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text)

            if [ "${WAIT_STATUS}" = "Success" ]; then
              echo "EC2 bootstrap ready."
              break
            fi

            if [ "${attempt}" -eq 36 ]; then
              echo "Timed out waiting for EC2 bootstrap."
              exit 1
            fi

            echo "Bootstrap not ready yet (${attempt}/36), retrying in 10s..."
            sleep 10
          done

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${INSTANCE_ID}" \
            --parameters "commands=/opt/batch2/deploy.sh ${IMAGE_URI}" \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}"

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query '[Status,StandardOutputContent,StandardErrorContent]'

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          body: |
            ### Deploy

            **ECR image:** `${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}`
