name: teamtnt

services:
  app:
    build: .
    # dev/editions runs a second stack with its own image tag and env file; both default to the usual ones.
    image: ${APP_IMAGE:-teknokent-app:local}
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    command: ["postgres", "-c", "log_min_messages=warning"]
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # Local Moodle 4.5 standing in for ODTÜClass while office hours (LTI 1.3) are built. Off by default:
  #   docker compose --profile moodle up -d   → http://localhost:8081 (first start installs Moodle, a few minutes)
  # Moodle keeps its own "moodle" database in the postgres service. See dev/moodle/README.md.
  moodle-db:
    profiles: ["moodle"]
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      PGPASSWORD: ${DATABASE_PASSWORD}
    entrypoint: ["sh", "-c"]
    command:
      - >
        until pg_isready -h postgres -U "${DATABASE_USERNAME}" -d "${DATABASE_NAME}"; do sleep 1; done;
        psql -h postgres -U "${DATABASE_USERNAME}" -d "${DATABASE_NAME}" -tAc "SELECT 1 FROM pg_database WHERE datname = 'moodle'" | grep -q 1
        || psql -h postgres -U "${DATABASE_USERNAME}" -d "${DATABASE_NAME}" -c "CREATE DATABASE moodle"
    depends_on:
      - postgres

  moodle:
    profiles: ["moodle"]
    image: bitnamilegacy/moodle:4.5
    ports:
      - "8081:8080"
    environment:
      MOODLE_DATABASE_TYPE: pgsql
      MOODLE_DATABASE_HOST: postgres
      MOODLE_DATABASE_PORT_NUMBER: 5432
      MOODLE_DATABASE_USER: ${DATABASE_USERNAME}
      MOODLE_DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      MOODLE_DATABASE_NAME: moodle
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: Admin-local-1
      MOODLE_EMAIL: admin@example.com
      MOODLE_SITE_NAME: ODTÜClass (local)
      # The tool lives on plain http://localhost locally; Moodle would refuse to call it otherwise.
      MOODLE_SSLPROXY: "no"
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata_data:/bitnami/moodledata
    healthcheck:
      test: ["CMD", "/opt/bitnami/php/bin/php", "-r", "exit(@file_get_contents('http://localhost:8080/login/index.php') === false ? 1 : 0);"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 120s
    depends_on:
      moodle-db:
        condition: service_completed_successfully

  # Registers Menton as an LTI 1.3 tool in Moodle and makes a test course (dev/moodle/scripts). Runs once Moodle
  # is up, as Moodle's web user so the cache files it writes stay usable. Prints the LTI_* lines for .env.
  moodle-setup:
    profiles: ["moodle"]
    image: bitnamilegacy/moodle:4.5
    user: daemon
    entrypoint: ["/opt/bitnami/php/bin/php", "/scripts/setup-office-hours.php"]
    environment:
      HTTP_HOST: localhost:8081
    volumes:
      - ./dev/moodle/scripts:/scripts:ro
      - moodle_data:/bitnami/moodle
      - moodledata_data:/bitnami/moodledata
    depends_on:
      moodle:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  moodle_data:
  moodledata_data:
